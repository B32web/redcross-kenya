<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – Red Cross Kenya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="logo-container">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" stroke="white" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="22" stroke="white"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="white"/>
        </svg>
      </span>
      <span class="logo-text">
        <span class="logo-title">Red Cross</span>
        <span class="logo-sub">Aid Distribution</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="dashboard.html">My Applications</a>
      <a href="apply.html">Apply for Aid</a>
    </nav>
    <div class="nav-buttons">
      <span id="user-menu">
        <div class="dropdown">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="dropdown-content">
            <a href="apply.html">New application</a>
            <button onclick="logoutUser()">Log out</button>
          </div>
        </div>
      </span>
    </div>
  </div>
</header>

<main class="container" style="padding-top:40px;">

  <div class="dash-header">
    <div>
      <h1>Welcome, <span id="dash-name">—</span></h1>
      <p>Track your aid applications and status.</p>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="label">Total applications</div><div class="value" id="total-apps">0</div></div>
    <div class="stat-card"><div class="label">Active / Pending</div><div class="value" id="pending-apps">0</div></div>
    <div class="stat-card"><div class="label">Approved / Active</div><div class="value" id="approved-apps">0</div></div>
  </div>

  <h2 style="font-size:19px; margin-bottom:16px;">Your applications</h2>
  <div id="applications-list">
    <div class="spinner"></div>
  </div>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; 2026 Red Cross Kenya | American Red Cross | Youth Red Cross</p>
  </div>
</footer>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
