<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in – Red Cross Kenya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="logo-container">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" stroke="white" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="22" stroke="white"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="white"/>
        </svg>
      </span>
      <span class="logo-text">
        <span class="logo-title">Red Cross</span>
        <span class="logo-sub">Aid Distribution</span>
      </span>
    </a>
    <a href="index.html" class="btn btn--ghost btn--sm">Back home</a>
  </div>
</header>

<main>
  <div class="panel">

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="showLoginTab()">Log in</button>
      <button class="auth-tab" id="tab-signup" onclick="showSignupTab()">Sign up</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <h2 class="panel-title">Welcome back</h2>
      <p class="panel-sub">Log in to view your applications.</p>

      <div id="login-error" class="form-error"></div>

      <label class="field">
        <span>Email address</span>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </label>

      <button class="btn btn--primary full-width" id="login-btn" onclick="handleLogin()">Log in</button>
    </div>

    <!-- SIGNUP -->
    <div id="signup-form" style="display:none;">
      <h2 class="panel-title">Create your account</h2>
      <p class="panel-sub">Join the Red Cross family – track your aid applications.</p>

      <div id="signup-error" class="form-error"></div>
      <div id="signup-success" class="form-success"></div>

      <label class="field">
        <span>Full name</span>
        <input type="text" id="signup-name" placeholder="Jane Wanjiru" autocomplete="name" />
      </label>
      <label class="field">
        <span>Email address</span>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label class="field">
        <span>Phone number</span>
        <input type="text" id="signup-phone" placeholder="0712345678" autocomplete="tel" />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="signup-password" placeholder="Any password works" autocomplete="new-password" />
      </label>

      <button class="btn btn--primary full-width" id="signup-btn" onclick="handleSignup()">Create account</button>
    </div>

  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
